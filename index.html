<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream Car Customizer</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <main class="configurator" id="app">
    <!-- Header -->
    <header class="configurator__header">
      <h1>Dream Car <span>Studio</span></h1>
      <button class="btn btn--ghost" id="resetBtn" type="button">Reset</button>
    </header>

    <!-- Two column layout -->
    <div class="configurator__grid">
      <!-- LEFT: Car preview -->
      <section class="preview" aria-label="Car preview">
        <div class="preview__stage" id="carStage">
          <!-- SVG injected by carRenderer.js -->
        </div>
        <ul class="preview__specs" id="carSpecs"></ul>
      </section>

      <!-- RIGHT: Controls -->
      <section class="controls" aria-label="Customization options">
        <!-- Paint -->
        <div class="panel">
          <h2 class="panel__title">Paint</h2>
          <div class="swatch-grid" id="paintSwatches"></div>
        </div>

        <!-- Wheels -->
        <div class="panel">
          <h2 class="panel__title">Wheels</h2>
          <div class="option-grid" id="wheelOptions"></div>
        </div>

        <!-- Finish (metallic/matte) -->
        <div class="panel">
          <h2 class="panel__title">Finish</h2>
          <div class="option-grid" id="finishOptions"></div>
        </div>

        <!-- Summary -->
        <div class="panel panel--summary">
          <h2 class="panel__title">Your Build</h2>
          <dl class="summary" id="summary"></dl>
        </div>
      </section>
    </div>
  </main>

  <!-- Load order matters -->
  <script src="js/config.js"></script>
  <script src="js/carRenderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
