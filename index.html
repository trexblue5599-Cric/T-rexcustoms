<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Volt - your Ollama Chat Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* ---------- CYAN NEON (DEFAULT) ---------- */
            --bg-deep: #0a0c10;
            --bg-primary: #0f1218;
            --bg-secondary: #141a22;
            --bg-elevated: #1a212b;
            --border-subtle: #1f2a36;
            --border-glow: #00e5ff;
            --text-primary: #e0f2fe;
            --text-secondary: #94a3b8;
            --text-assistant: #7dd3fc;
            --user-bg: #0b2b3b;
            --user-border: #00e5ff;
            --assistant-bg: #0e1a26;
            --assistant-border: #1e3a4f;
            --neon: #00e5ff;
            --neon-dim: #00b8d4;
            --neon-glow: 0 0 10px rgba(0, 229, 255, 0.5), 0 0 20px rgba(0, 229, 255, 0.2);
            --neon-glow-intense: 0 0 15px rgba(0, 229, 255, 0.7), 0 0 30px rgba(0, 229, 255, 0.3);
            --shadow-deep: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius-xl: 20px;
            --radius-lg: 16px;
        }

        body.lime-theme {
            --border-glow: #39ff14;
            --text-assistant: #a8ff78;
            --user-bg: #0b2b1a;
            --user-border: #39ff14;
            --assistant-bg: #0e2618;
            --assistant-border: #1e4f2a;
            --neon: #39ff14;
            --neon-dim: #2ecc40;
            --neon-glow: 0 0 10px rgba(57, 255, 20, 0.5), 0 0 20px rgba(57, 255, 20, 0.2);
            --neon-glow-intense: 0 0 15px rgba(57, 255, 20, 0.7), 0 0 30px rgba(57, 255, 20, 0.3);
        }

        html {
            color-scheme: dark;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 20% 0%, rgba(0, 229, 255, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 100%, rgba(0, 229, 255, 0.04) 0%, transparent 50%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.25s ease, color 0.25s ease;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        body.lime-theme {
            background-image: 
                radial-gradient(circle at 20% 0%, rgba(57, 255, 20, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 100%, rgba(57, 255, 20, 0.04) 0%, transparent 50%);
        }

        /* ---------- HEADER ---------- */
        header {
            background: linear-gradient(180deg, #121821 0%, #0f141c 100%);
            color: white;
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            border-bottom: 1px solid var(--neon-dim);
            box-shadow: 0 2px 20px rgba(0, 229, 255, 0.15);
            position: relative;
            z-index: 10;
            transition: box-shadow 0.25s ease, border-color 0.25s ease;
        }

        body.lime-theme header {
            box-shadow: 0 2px 20px rgba(57, 255, 20, 0.15);
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
            opacity: 0.6;
            pointer-events: none;
            transition: background 0.25s ease;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
            flex: 1 1 auto;
            transition: text-shadow 0.25s ease;
        }

        body.lime-theme header h1 {
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.4);
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ---------- BUTTONS ---------- */
        .btn {
            padding: 0.55rem 1.2rem;
            border: 1px solid var(--neon-dim);
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            background: rgba(0, 229, 255, 0.08);
            color: var(--neon);
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.02em;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.1);
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        body.lime-theme .btn {
            background: rgba(57, 255, 20, 0.08);
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.1);
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.3);
        }

        .btn:hover {
            background: rgba(0, 229, 255, 0.18);
            border-color: var(--neon);
            box-shadow: var(--neon-glow);
            transform: translateY(-1px);
            color: #ffffff;
        }

        body.lime-theme .btn:hover {
            background: rgba(57, 255, 20, 0.18);
        }

        /* ---------- THEME TOGGLE ---------- */
        #theme-toggle {
            background: rgba(0, 229, 255, 0.06);
            border: 1px solid var(--neon-dim);
            color: var(--neon);
            font-size: 1.5rem;
            width: 42px;
            height: 42px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            padding: 0;
            line-height: 1;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.1);
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
        }

        body.lime-theme #theme-toggle {
            background: rgba(57, 255, 20, 0.06);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.1);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.6);
        }

        #theme-toggle:hover {
            box-shadow: var(--neon-glow);
            border-color: var(--neon);
            color: #ffffff;
        }

        /* ---------- MODEL SELECTOR ---------- */
        #model-selector {
            padding: 0.55rem 2rem 0.55rem 1.2rem;
            border-radius: 40px;
            background-color: var(--bg-elevated);
            color: var(--neon);
            border: 1px solid var(--neon-dim);
            font-size: 0.9rem;
            font-weight: 500;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%2300e5ff' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position-x: calc(100% - 10px);
            background-position-y: 50%;
            cursor: pointer;
            transition: border 0.25s, box-shadow 0.25s;
            max-width: 200px;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.08);
            text-shadow: 0 0 6px rgba(0, 229, 255, 0.3);
        }

        body.lime-theme #model-selector {
            background-image: url("data:image/svg+xml;utf8,<svg fill='%2339ff14' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.08);
            text-shadow: 0 0 6px rgba(57, 255, 20, 0.3);
        }

        #model-selector:focus {
            outline: none;
            border-color: var(--neon);
            box-shadow: var(--neon-glow);
        }

        #model-selector option {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        /* ---------- CHAT AREA ---------- */
        #chat {
            flex: 1;
            padding: 1.8rem 2rem;
            overflow-y: auto;
            background-color: var(--bg-primary);
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            margin: 1.5rem 2rem;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-deep), inset 0 0 60px rgba(0, 229, 255, 0.03);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            scroll-behavior: smooth;
            position: relative;
            transition: box-shadow 0.25s ease;
        }

        body.lime-theme #chat {
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.02) 1px, transparent 1px);
            box-shadow: var(--shadow-deep), inset 0 0 60px rgba(57, 255, 20, 0.03);
        }

        #chat::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-xl);
            padding: 1px;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.3), transparent 40%, transparent 60%, rgba(0, 229, 255, 0.15));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: background 0.25s ease;
        }

        body.lime-theme #chat::before {
            background: linear-gradient(135deg, rgba(57, 255, 20, 0.3), transparent 40%, transparent 60%, rgba(57, 255, 20, 0.15));
        }

        #chat::-webkit-scrollbar {
            width: 6px;
        }

        #chat::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat::-webkit-scrollbar-thumb {
            background: var(--neon-dim);
            border-radius: 20px;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }

        body.lime-theme #chat::-webkit-scrollbar-thumb {
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
        }

        /* ---------- MESSAGES ---------- */
        .message {
            padding: 1rem 1.3rem;
            border-radius: var(--radius-lg);
            line-height: 1.55;
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease;
            position: relative;
            border: 1px solid transparent;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-bg);
            color: var(--text-primary);
            border-bottom-right-radius: 6px;
            border-color: var(--user-border);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.15), inset 0 0 20px rgba(0, 229, 255, 0.03);
        }

        body.lime-theme .message.user {
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.15), inset 0 0 20px rgba(57, 255, 20, 0.03);
        }

        .message.assistant {
            align-self: flex-start;
            background-color: var(--assistant-bg);
            color: var(--text-assistant);
            border-bottom-left-radius: 6px;
            border-color: var(--assistant-border);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.08), inset 0 0 20px rgba(0, 229, 255, 0.02);
        }

        body.lime-theme .message.assistant {
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.08), inset 0 0 20px rgba(57, 255, 20, 0.02);
        }

        .message p {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message strong {
            font-weight: 600;
            color: var(--neon);
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }

        body.lime-theme .message strong {
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
        }

        .message em {
            font-style: italic;
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from { opacity: 0.6; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- INPUT CONTAINER (FIXED - BIGGER TEXT BOX) ---------- */
        #input-container {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 1rem 2rem 1.5rem 2rem;
            background-color: var(--bg-deep);
            position: relative;
        }

        #user-input {
            flex: 1;
            min-height: 90px;
            max-height: 220px;
            padding: 1rem 1.2rem;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            resize: vertical;
            overflow-y: auto;
            line-height: 1.5;
            transition: border 0.25s, box-shadow 0.25s;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        #user-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        #user-input:focus {
            outline: none;
            border-color: var(--neon);
            box-shadow: var(--neon-glow), inset 0 0 20px rgba(0, 229, 255, 0.05);
        }

        body.lime-theme #user-input:focus {
            box-shadow: var(--neon-glow), inset 0 0 20px rgba(57, 255, 20, 0.05);
        }

        #input-container button {
            padding: 0.9rem 1.8rem;
            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid var(--neon-dim);
            border-radius: 40px;
            background: rgba(0, 229, 255, 0.08);
            color: var(--neon);
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.12);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
        }

        body.lime-theme #input-container button {
            background: rgba(57, 255, 20, 0.08);
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.12);
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.3);
        }

        #input-container button:hover {
            background: rgba(0, 229, 255, 0.2);
            border-color: var(--neon);
            box-shadow: var(--neon-glow-intense);
            transform: translateY(-2px);
            color: #ffffff;
        }

        body.lime-theme #input-container button:hover {
            background: rgba(57, 255, 20, 0.2);
        }

        #input-container button:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
            border-color: var(--border-subtle);
            color: var(--text-secondary);
        }

        #new-button {
            background: transparent;
            border-color: var(--neon-dim);
            color: var(--neon);
            box-shadow: none;
        }

        #new-button:hover {
            background: rgba(0, 229, 255, 0.1);
            border-color: var(--neon);
            box-shadow: var(--neon-glow);
            color: #ffffff;
        }

        body.lime-theme #new-button:hover {
            background: rgba(57, 255, 20, 0.1);
        }

        /* ---------- SPINNER ---------- */
        #spinner {
            display: none;
            margin-right: 8px;
            align-self: center;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(0, 229, 255, 0.15);
            border-top: 3px solid var(--neon);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
        }

        body.lime-theme #spinner {
            border: 3px solid rgba(57, 255, 20, 0.15);
            border-top: 3px solid var(--neon);
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.3);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 700px) {
            header { padding: 0.8rem 1.2rem; }
            header h1 { font-size: 1.1rem; }
            #chat { margin: 1rem; padding: 1.2rem; }
            #input-container { padding: 0.8rem 1rem 1.2rem 1rem; flex-wrap: wrap; }
            #input-container button { padding: 0.8rem 1.3rem; font-size: 0.9rem; }
            .message { max-width: 95%; padding: 0.9rem 1.1rem; }
            #model-selector { max-width: 140px; font-size: 0.8rem; padding: 0.5rem 1.8rem 0.5rem 1rem; }
            #user-input { min-height: 80px; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="header-title">Volt - your Ollama Chat Assistant</h1>
        <div class="header-buttons">
            <select id="model-selector" style="display: none;">
                <option disabled selected>Select Model</option>
            </select>
            <button class="btn" onclick="window.location.href='notes.html'">Notes</button>
            <button id="theme-toggle" title="Toggle Cyan / Lime">◐</button>
        </div>
    </header>
    <div id="chat"></div>
    <div id="input-container">
        <div id="spinner"></div>
        <textarea id="user-input" placeholder="Ask Volt anything..." rows="3"></textarea>
        <button id="send-button">Send</button>
        <button id="new-button">New</button>
    </div>

    <script>
        const CHAT_TITLE = "Volt - your Ollama Chat Assistant";
        const CHAT_MODEL = "Alieno/ailo-152m-v2";
        const OLLAMA_PATH = "http://localhost:11434";
        const SHOW_NOTE_APP = true;
        const MODEL_SELECTABLE = true;

        let AVAILABLE_MODELS = []; 
        let all_messages = [];

        async function fetchAvailableModels() {
            try {
                const response = await fetch(`${OLLAMA_PATH}/api/tags`);
                if (!response.ok) throw new Error('Failed to fetch models');
                const data = await response.json();
                AVAILABLE_MODELS = data.models.map(model => model.name);
                const modelSelector = document.getElementById('model-selector');
                modelSelector.innerHTML = '<option disabled>Select Model</option>';
                AVAILABLE_MODELS.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model;
                    option.textContent = model;
                    modelSelector.appendChild(option);
                });
                const savedModel = localStorage.getItem('selectedModel') || CHAT_MODEL;
                if (AVAILABLE_MODELS.includes(savedModel)) modelSelector.value = savedModel;
                if (AVAILABLE_MODELS.length > 0) modelSelector.style.display = 'block';
            } catch (error) {
                console.error('Error fetching models:', error);
                AVAILABLE_MODELS = [CHAT_MODEL];
            }
        }

        const notesButton = document.querySelector('.btn[onclick="window.location.href=\'notes.html\'"]');
        if (!SHOW_NOTE_APP && notesButton) notesButton.style.display = 'none';

        document.getElementById('page-title').textContent = CHAT_TITLE;
        document.getElementById('header-tit
