<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Kingdoms at War</title>
  
  <!-- Link to CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= MENU SCREEN ================= -->
  <div id="menu-screen">
    <h1>⚔️ KINGDOMS AT WAR</h1>
    <p class="subtitle">Build your army. Rule the kingdom.</p>
    
    <div class="menu-options">
      <button class="menu-btn disabled">Campaign Mode <br><small>Coming soon</small></button>
      <button class="menu-btn" onclick="startGame('survival')">Survival Mode <br><small>Fight endless waves</small></button>
      <button class="menu-btn disabled">Unknown Mode <br><small>Coming soon</small></button>
    </div>
  </div>

  <!-- ================= GAME SCREEN ================= -->
  <div id="game-screen" class="hidden">
    <div id="top-bar">
      <h3>⚔️ Kingdoms at War</h3>
      <div id="stats">
        Gold: <span id="gold">350</span>
      </div>
    </div>

    <div id="ui">
      <button onclick="recruit('miner', 75)">Miner (75)</button>
      <button onclick="recruit('sword', 100)">Swordsman (100)</button>
      <button onclick="recruit('archer', 150)">Archer (150)</button>
    </div>

    <div id="commands">
      <button onclick="commandArmy('attack')">Attack</button>
      <button onclick="commandArmy('defend')">Defend</button>
      <button onclick="commandArmy('retreat')">Retreat</button>
      <button onclick="goToMenu()" class="danger-btn">Main Menu</button>
    </div>

    <!-- Phaser Game will be injected here -->
    <div id="game-container"></div>
  </div>

  <!-- Phaser Engine -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  
  <!-- Link to your JS -->
  <script src="game.js"></script>

</body>
</html>
