<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kingdoms at War</title>
  <style>
    body {
      margin: 0;
      background: #172033;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #ui {
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    button {
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #334155;
      color: white;
      font-weight: bold;
    }
    canvas {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

<h2>⚔️ Kingdoms at War</h2>
<div id="stats">
  Gold: <span id="gold">350</span>
</div>

<div id="ui">
  <button onclick="recruit('miner')">Miner (75)</button>
  <button onclick="recruit('sword')">Swordsman (100)</button>
  <button onclick="recruit('archer')">Archer (150)</button>
  <button onclick="commandArmy('attack')">Attack</button>
  <button onclick="commandArmy('defend')">Defend</button>
  <button onclick="commandArmy('retreat')">Retreat</button>
</div>

<div id="game"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="game.js"></script>

</body>
</html>
